services:
  - type: web
    name: cv8-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: text-embedding-3-small
      - key: AZURE_OPENAI_EMBEDDING_DIMENSIONS
        value: "1536"
      - key: MATCH_DEADLINE_SECONDS
        value: "75"
      - key: MATCH_EMBEDDINGS_TIMEOUT_SECONDS
        value: "20"
      - key: MATCH_LLM_TIMEOUT_SECONDS
        value: "45"
      - key: MATCH_CANDIDATES_K
        value: "8"